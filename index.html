const $=s=>document.querySelector(s),key='vince-pay-demo-v1';let data={},storage=true;try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{storage=false}const countries={France:{dial:'+33',max:9,groups:[1,2,2,2,2]},Belgique:{dial:'+32',max:9,groups:[3,2,2,2]},Suisse:{dial:'+41',max:9,groups:[2,3,2,2]},Luxembourg:{dial:'+352',max:9,groups:[3,3,3]},Canada:{dial:'+1',max:10,groups:[3,3,4]}};function phoneConfig(){return countries[data.country]||countries.France}function formatPhone(value){let digits=value.replace(/\D/g,'');const cfg=phoneConfig();if(digits.startsWith('00'+cfg.dial.slice(1)))digits=digits.slice(cfg.dial.length+1);else if(value.trim().startsWith(cfg.dial))digits=digits.slice(cfg.dial.length-1);if(cfg.dial!=='+1')digits=digits.replace(/^0/,'');digits=digits.slice(0,cfg.max);let out=[],pos=0;for(const size of cfg.groups){if(pos<digits.length)out.push(digits.slice(pos,pos+size));pos+=size}return out.join(' ')}function fullPhone(){return phoneConfig().dial+' '+(data.phone||'')}let lang=data.lang||'fr',step=data.phone?'return':1,manual=true,errors={},choice=data.choice||'now',timer,origin;const t=(fr,en)=>lang==='fr'?fr:en;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function go(n){if(typeof n==='number'&&n>=5&&!isAdult(data.birth)){step=4;render();validate();return}clearTimeout(timer);errors={};step=n;if(typeof n==='number'&&n!==6)data.lastStep=n;save();render();$('#main').focus();window.scrollTo(0,0);if(n===6)timer=setTimeout(()=>go(7),1600)}function render(){document.documentElement.lang=lang;$('#header').innerHTML=`${step===1||step==='return'?`<span class="header-spacer" aria-hidden="true"></span>`:`<button class="iconbtn" data-action="back" aria-label="${t('Retour','Back')}">${icon('arrow')}</button>`}<div class="logo" aria-label="Vince Pay"><b>V</b>ince <em>pay</em></div><button class="iconbtn close" data-action="exit" aria-label="${t('Fermer le parcours','Close journey')}">${icon('close')}</button>`;$('#progress').style.width=(typeof step==='number'?Math.min(step/8*100,100):0)+'%';$('#footer').innerHTML=`<div class="links">${link(t('Conditions d’utilisation','Terms of use'),'terms')}${link(t('Confidentialité','Privacy'),'privacy')}${link(t('Cookies','Cookies'),'cookies')}${link(t('À propos du prototype','About this demo'),'about')}</div><div class="locknote">${icon('lock',13)} ${t('Prototype · Aucun paiement réel','Prototype · No real payment')}</div>`;let s=`<div class="demo"><span class="dot"></span>${t('Prototype — aucun paiement réel','Prototype — no real payment')}</div>`;

if(step===6)s+=`<div class="center"><div class="illustration" aria-hidden="true"><div class="orb"></div><div class="payart"><b>Vince Pay</b><br><br>•••• &nbsp; 2048</div><div class="coin">${icon('check',26)}</div><div class="star">${icon('spark',38)}</div></div><h1>${t('Préparation de vos options','Preparing demo options')}</h1><p>${t('Un instant, nous y sommes presque','One moment, almost there')}</p><span class="spinner" aria-label="${t('Chargement','Loading')}"></span></div>`;
if(step===7)s+=`<h1>${t('À votre rythme.','At your own pace.')}</h1><p>${t('Choisissez comment payer, en toute simplicité.','Choose how to pay, simply.')}</p><div role="radiogroup" aria-label="${t('Options de paiement','Payment options')}">${paycard('now',t('Payez maintenant','Pay now'),t('0 € aujourd’hui','€0 today'),t('Simulation sans débit','Simulation with no charge'))}<div class="divider">${t('Autres options','Other options')}</div>${paycard('three',t('Paiement en 3 fois','Pay in 3'),t('0 € par mois','€0 per month'),t('Exemple sans intérêts','Interest-free example'))}</div><p class="fine center">${link(t('Vous ne trouvez pas votre option préférée ?','Cannot find your preferred option?'),'options')}</p>${btn(t('Continuer','Continue'),'submit')}`;
if(step===8)s+=`<h1>${t('Ajouter un moyen de paiement','Add a demo payment method')}</h1><p>${t('Utilisez uniquement les données de test proposées. Aucune carte réelle n’est nécessaire et aucun paiement ne sera effectué.','Use only the provided test data. No real card is needed and no payment will be made.')}</p>${btn(t('Simuler un paiement mobile','Simulate a mobile payment'),'mobile',true)}<div class="divider">${t('ou','or')}</div><label class="fixedlabel" for="testcard">${icon('card',16)} ${t('Numéro de carte de test','Test card number')}</label><input id="testcard" class="testinput" readonly value="4242 4242 4242 4242"><div class="columns"><div><label class="fixedlabel" for="expiry">${icon('card',16)} ${t('Date d’expiration','Expiry date')}</label><input id="expiry" class="testinput" readonly value="12/30"></div><div><label class="fixedlabel" for="cvc">${icon('lock',14)} ${t('CVC de test','Test CVC')}</label><input id="cvc" class="testinput" readonly value="123"></div></div><p class="fine">${t('Données de test fixes. Aucune coordonnée bancaire n’est enregistrée.','Fixed test data. No bank details are stored.')}</p><div class="row"><span>${choice==='three'?t('3 × 0,00 €','3 × €0.00'):t('Aujourd’hui','Today')}</span><strong>0,00 € ${t('au total','total')}</strong></div>${btn(t('Valider la simulation','Confirm simulation'),'finish')}`;
if(step===9)s+=`<div class="successicon">${icon('check',42)}</div><h1 class="center">${t('Parcours terminé — aucun paiement effectué','Demo complete — no payment made')}</h1><p class="center">${t('Vous avez découvert le parcours Vince Pay. Merci de votre visite !','You have explored the Vince Pay experience. Thanks for visiting!')}</p><div class="green">${icon('shield')}<div>${t('Simulation uniquement','Simulation only')}<p>${choice==='three'?t('3 échéances fictives de 0,00 €','3 fictional instalments of €0.00'):'0,00 €'} · ${t('Aucun débit','No charge')}</p></div></div>${btn(t('Revoir mon profil','Review my profile'),'summary')}${btn(t('Effacer mon profil de démonstration','Erase my demo profile'),'erase',true)}`;
if(step==='closed')s+=`<h1>${t('À bientôt chez Vince Pay','See you soon at Vince Pay')}</h1><p>${t('Le parcours est fermé. Votre profil fictif reste disponible sur ce navigateur.','The journey is closed. Your fictional profile remains available in this browser.')}</p>${btn(t('Reprendre le parcours','Resume the demo'),'resume')}${btn(t('Effacer les données locales','Erase local data'),'erase',true)}`;
$('#main').innerHTML=s;}
function initials(){return esc(((data.first||'V')[0]+(data.last||'P')[0]).toUpperCase())}function paycard(id,title,amount,sub){return `<div class="card ${choice===id?'selected':''}" role="radio" aria-checked="${choice===id}" tabindex="${choice===id?'0':'-1'}" data-choice="${id}"><span class="radio">${choice===id?icon('check',16):''}</span>${icon('card',27)}<h2>${title}</h2><strong>${amount}</strong><p>${sub}</p>${id==='three'?`<span class="badge greenbadge">${t('Simulation','Simulation')}</span><div class="row" style="background:none;font-size:14px"><span>${t('0,00 € aujourd’hui','€0.00 today')}</span><b>Total 0,00 €</b></div>`:''}</div>`}
function isAdult(value,now=new Date()){const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value||'');if(!m)return false;const day=+m[1],month=+m[2],year=+m[3],birth=new Date(Date.UTC(year,month-1,day));if(year<1900||birth.getUTCFullYear()!==year||birth.getUTCMonth()!==month-1||birth.getUTCDate()!==day)return false;const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=k=>+parts.find(p=>p.type===k).value;const age=get('year')-year-((get('month')<month||(get('month')===month&&get('day')<day))?1:0);return age>=18} 
function validate(){errors={};const required=t('Ce champ est obligatoire.','This field is required.');if(step===1&&(data.phone||'').replace(/\D/g,'').length!==phoneConfig().max)errors.phone=t('Saisissez un numéro fictif complet pour le pays sélectionné.','Enter a valid fictional number (e.g. 0600000000).');if(step===2&&!/^\d{6}$/.test(data.code||''))errors.code=t('Saisissez un code de 6 chiffres.','Enter a 6-digit code.');if(step===3&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email||''))errors.email=t('Saisissez une adresse e-mail valide.','Enter a valid email address.');if(step===4){['first','last','birth'].forEach(k=>{if(!data[k]?.trim())errors[k]=required});let m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(data.birth||'');if(m){let d=new Date(+m[3],+m[2]-1,+m[1]);if(d.getFullYear()!==+m[3]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[1]||d>new Date()||+m[3]<1900)m=null}if(!m)errors.birth=t('Saisissez une date au format JJ/MM/AAAA.','Enter a valid date in DD/MM/YYYY format.');else if(!isAdult(data.birth))errors.birth=t('Vous devez avoir au moins 18 ans pour poursuivre ce parcours.','You must be at least 18 to continue this journey.');['address','postal','city'].forEach(k=>{if(!data[k]?.trim())errors[k]=required});if(errors.address||errors.postal||errors.city)manual=true}if(Object.keys(errors).length){render();let first=document.getElementById(Object.keys(errors)[0]);first?.focus();announce(Object.values(errors).join(' '));return false}return true}
let closeTimer;function modal(title,body){origin=document.activeElement;let d=$('#modal');d.innerHTML=`<button class="iconbtn modalclose" data-action="modalclose" aria-label="${t('Fermer','Close')}">${icon('close')}</button><h2 id="modal-title">${title}</h2>${body}`;if(!d.open)d.showModal();d.querySelector('button,input,select')?.focus()}function closeModal(){let d=$('#modal');d.close();origin?.focus()}function legal(kind){const content={terms:[t('Conditions d’utilisation','Terms of use'),t('Vince Pay est un prototype interactif. Aucun compte financier n’est créé, aucun achat n’est réalisé et aucun service de paiement n’est fourni. Saisissez uniquement des données fictives.','Vince Pay is an interactive prototype. No financial account is created, no purchase is made and no payment service is provided. Enter fictional data only.')],privacy:[t('Politique de confidentialité','Privacy policy'),t('Les données fictives du profil et votre préférence restent dans le stockage local de ce navigateur. Elles ne sont envoyées à aucun service de paiement ou de messagerie. Aucun numéro de carte saisi n’est collecté. Vous pouvez effacer le profil avec le bouton ci-dessous. L’hébergement peut traiter les informations techniques nécessaires à l’accès au site.','Fictional profile data and your preference stay in this browser’s local storage. They are not sent to any payment or messaging service. No entered card number is collected. You can erase your profile below. Hosting may process technical information required to access the site.')],cookies:[t('Politique des cookies','Cookie policy'),t('Ce prototype n’ajoute pas de cookie publicitaire ou analytique. Le stockage local conserve le profil fictif et la langue pour proposer la reprise du parcours. Vous pouvez le supprimer ci-dessous. Les mécanismes d’accès de l’hébergeur sont indépendants du prototype.','This prototype adds no advertising or analytics cookies. Local storage remembers the fictional profile and language so you can resume. You can delete it below. Hosting access mechanisms are independent of the prototype.')],about:[t('À propos du prototype','About this demo'),t('Vince Pay est un concept original de démonstration. Montant fictif : 0,00 €. Aucun SMS, e-mail, débit ou installation d’application. Le profil enregistré n’est pas une authentification sécurisée et reste propre à ce navigateur.','Vince Pay is an original demo concept. Fictional amount: €0.00. No text, email, charge or app installation. The saved profile is not secure authentication and stays in this browser.')]};modal(content[kind][0],`<p>${content[kind][1]}</p>${kind==='privacy'||kind==='cookies'?btn(t('Effacer les données locales','Erase local data'),'erase',true):''}${btn(t('Fermer','Close'),'modalclose')}`)}
document.addEventListener('input',e=>{if(e.target.closest('#main')&&e.target.id){let value=e.target.value;if(e.target.id==='phone')value=formatPhone(value);if(e.target.id==='birth'){let digits=value.replace(/\D/g,'').slice(0,8);value=[digits.slice(0,2),digits.slice(2,4),digits.slice(4,8)].filter(Boolean).join('/')}if(e.target.id==='code')value=value.replace(/\D/g,'').slice(0,6);if(['phone','birth','code'].includes(e.target.id)){let end=e.target.selectionStart===e.target.value.length;let pos=e.target.selectionStart;e.target.value=value;if(!end)e.target.setSelectionRange(Math.min(pos,value.length),Math.min(pos,value.length))}data[e.target.id]=e.target.type==='checkbox'?e.target.checked:value;save();}});document.addEventListener('keydown',e=>{if(e.target.matches('[data-choice]')&&[' ','Enter','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();choice=[' ','Enter'].includes(e.key)?e.target.dataset.choice:(choice==='now'?'three':'now');save();render();document.querySelector(`[data-choice="${choice}"]`).focus()}else if(e.key==='Enter'&&e.target.matches('#main input')&&e.target.type!=='checkbox'){e.preventDefault();action('submit')}if(e.key==='Escape'){$('.langmenu')?.remove();$('[data-action="language"]')?.setAttribute('aria-expanded','false')}});document.addEventListener('click',e=>{let c=e.target.closest('[data-choice]');if(c){choice=c.dataset.choice;save();render();document.querySelector(`[data-choice="${choice}"]`).focus();return}let l=e.target.closest('[data-lang]');if(l){lang=l.dataset.lang;save();closeModal();render();document.querySelector('[data-action="language"]')?.focus();announce(t('Langue sélectionnée : français','Selected language: English'));return}let b=e.target.closest('[data-action]');if(b)action(b.dataset.action,b);if(!e.target.closest('[data-action="language"],.langmenu')){$('.langmenu')?.remove();$('[data-action="language"]')?.setAttribute('aria-expanded','false')}});$('#modal').addEventListener('click',e=>{let r=e.currentTarget.getBoundingClientRect();if(e.target===$('#modal')&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))closeModal()});$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
function action(a,b){if(['terms','privacy','cookies','about'].includes(a))return legal(a);switch(a){case'language':modal(t('Langue de l’interface','Interface language'),`<p>${t('Choisissez votre langue.','Choose your language.')}</p><button class="btn ${lang==='fr'?'':'secondary'}" data-lang="fr">Français</button><button class="btn ${lang==='en'?'':'secondary'}" data-lang="en">English</button>`);break;case'back':go(step===9?8:step===7?5:typeof step==='number'?Math.max(1,step-1):1);break;case'submit':if(validate()){if(step===7)go(8);else go(step+1)}break;case'app':modal('Vince Pay',`<div class="appicon">V</div><p class="fine">${t('Démonstration d’interface de paiement','Payment interface demo')}</p><span class="badge">${t('Démonstration — application indisponible','Demo — app unavailable')}</span><p>${t('Cette fiche présente le concept de l’application Vince Pay. Aucune application n’est actuellement disponible à installer.','This page presents the Vince Pay app concept. No application is currently available to install.')}</p>${btn(t('Explorer la démonstration','Explore the demo'),'explore')}${btn(t('Fermer','Close'),'modalclose',true)}`);break;case'explore':closeModal();data.phone=data.phone||formatPhone('0600000000');go(2);break;case'modalclose':closeModal();break;case'editphone':go(1);break;case'birthhelp':modal(t('Date de naissance fictive','Fictional date of birth'),`<p>${t('Utilisez le format JJ/MM/AAAA, par exemple 15/06/1995. Saisissez une date fictive valide correspondant à un âge de 18 ans ou plus.','Use DD/MM/YYYY, for example 15/06/1995. Enter a valid fictional date for someone aged 18 or over.')}</p>${btn(t('Compris','Got it'),'modalclose')}`);break;case'country':modal(t('Pays de résidence','Country of residence'),`<label class="fixedlabel" for="country">${t('Choisir un pays','Choose a country')}</label><select id="country" class="testinput">${['France','Belgique','Suisse','Luxembourg','Canada'].map(c=>`<option ${data.country===c?'selected':''}>${c}</option>`).join('')}</select>${btn(t('Confirmer','Confirm'),'setcountry')}`);break;case'setcountry':data.country=$('#country').value;data.phone=formatPhone(data.phone||'');save();closeModal();render();break;case'manual':manual=true;render();$('#address').focus();break;case'editprofile':go(4);break;case'editemail':go(3);break;case'shop':modal(t('Boutique Vince Pay','Demo store'),`<p>${t('Une boutique fictive pour explorer Vince Pay. Aucun produit ne sera expédié.','A fictional store to explore Vince Pay. No product will be shipped.')}</p>${btn(t('Voir la commande','View order'),'order')}`);break;case'order':modal(t('Votre commande fictive','Your fictional order'),`<div class="row"><span>${t('Objet de démonstration × 1','Demo item × 1')}</span><strong>0,00 €</strong></div><p class="fine">${t('Livraison fictive : offerte. Total : 0,00 €.','Fictional shipping: free. Total: €0.00.')}</p>${btn(t('Fermer','Close'),'modalclose')}`);break;case'load':go(6);break;case'options':modal(t('Options de démonstration','Demo options'),`<p>${t('Deux options sont disponibles : 0 € aujourd’hui ou trois échéances fictives de 0 €. Elles n’impliquent ni débit, ni crédit, ni engagement financier.','Two options are available: €0 today or three fictional instalments of €0. Neither involves any charge, credit or financial commitment.')}</p>${btn(t('Compris','Got it'),'modalclose')}`);break;case'mobile':modal(t('Simulation mobile Vince Pay','Vince Pay mobile simulation'),`<div class="appicon">V</div><p>${t('Ceci est une fenêtre Vince Pay de démonstration. Aucun portefeuille mobile réel n’est connecté.','This is a Vince Pay demo window. No real mobile wallet is connected.')}</p><h2>0,00 €</h2>${btn(t('Confirmer la simulation','Confirm simulation'),'mobileconfirm')}${btn(t('Retour au formulaire','Back to form'),'modalclose',true)}`);break;case'mobileconfirm':closeModal();go(9);break;case'finish':b.disabled=true;b.innerHTML=`<span class="spinner"></span>${t('Validation de la simulation…','Validating simulation…')}`;setTimeout(()=>go(9),700);break;case'summary':go(5);break;case'resume':go(Math.min(data.lastStep||1,9));break;case'exit':if(data.phone||data.email||data.first)modal(t('Quitter la démonstration ?','Leave the demo?'),`<p>${t('Votre profil fictif restera mémorisé dans ce navigateur. Vous pourrez reprendre plus tard.','Your fictional profile will stay in this browser. You can resume later.')}</p>${btn(t('Continuer le parcours','Continue the journey'),'modalclose')}${btn(t('Quitter','Leave'),'quit',true)}`);else go('closed');break;case'quit':closeModal();go('closed');break;case'erase':modal(t('Effacer le profil fictif ?','Erase fictional profile?'),`<p>${t('Les informations de démonstration enregistrées dans ce navigateur seront supprimées.','The demo information saved in this browser will be deleted.')}</p>${btn(t('Effacer et recommencer','Erase and restart'),'confirmErase')}${btn(t('Conserver mon profil','Keep my profile'),'modalclose',true)}`);break;case'confirmErase':try{localStorage.removeItem(key)}catch{}data={};choice='now';manual=true;closeModal();go(1);announce(t('Profil effacé.','Profile erased.'));break}}
render();

</script></body></html>
